[phases.setup]
nixPkgs = ["nodejs", "php82", "php82Packages.composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci --no-audit --no-fund"
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan vendor:publish --provider='L5Swagger\\L5SwaggerServiceProvider' --force || true; php artisan l5-swagger:generate || true; php artisan migrate --force || true; php artisan tenants:migrate --force || true; php artisan serve --host=0.0.0.0 --port=$PORT"

