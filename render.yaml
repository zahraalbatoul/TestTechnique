services:
- type: web
  name: multi-tenant-pm
  env: php
  buildCommand: |
    composer install --no-dev --optimize-autoloader
    php artisan key:generate --force
    php artisan config:cache
    npm ci && npm run build
  startCommand: |
    php artisan migrate --force && php artisan tenants:migrate --force --all || true
    php artisan serve --host 0.0.0.0 --port 
  envVars:
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: false
  - key: APP_URL
    value: https://YOUR-SERVICE.onrender.com
  - key: DB_CONNECTION
    value: pgsql
  - key: DB_HOST
    value: dpg-d41kgfje5dus73ddmli0-a
  - key: DB_PORT
    value: 5432
  - key: DB_DATABASE
    value: centraldb_mmt1
  - key: DB_USERNAME
    value: central_user
  - key: DB_PASSWORD
    sync: false
  - key: SESSION_DRIVER
    value: cookie
  - key: CACHE_DRIVER
    value: file
  - key: QUEUE_CONNECTION
    value: sync
  - key: L5_SWAGGER_GENERATE_ALWAYS
    value: true
